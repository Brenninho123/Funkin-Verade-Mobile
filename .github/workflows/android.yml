name: Android Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      demo:
        description: Include DEMO define
        type: boolean
        default: true

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a
  HAXE_VERSION: 4.3.7
  NDK_VERSION: 25.2.9519653
  HXCPP_VERSION: 4.3.45

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.set.outputs.demo }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "demo=${{ inputs.demo }}" >> "$GITHUB_OUTPUT"
          else
            echo "demo=true" >> "$GITHUB_OUTPUT"
          fi

          version=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-${GITHUB_SHA::7}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android (debug)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/Project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache optimized PNGs
        uses: actions/cache@v4
        with:
          path: .png-opt-cache
          key: ${{ runner.os }}-pngopt-${{ hashFiles('assets/**/*.png') }}
          restore-keys: |
            ${{ runner.os }}-pngopt-

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Optimize PNG
        run: |
          sudo apt-get install -y optipng pngquant parallel --quiet
          mkdir -p .png-opt-cache

          find assets -type f -iname "*.png" -print0 > /tmp/pnglist.txt

          process_png() {
            file="$1"
            hash=$(sha1sum "$file" | cut -d' ' -f1)
            cached=".png-opt-cache/$hash.png"

            if [ -f "$cached" ]; then
              cp "$cached" "$file"
            else
              pngquant --force --skip-if-larger --strip --speed 1 --quality=65-90 --output "$file.tmp" "$file" 2>/dev/null && mv "$file.tmp" "$file" || rm -f "$file.tmp"
              optipng -quiet -o4 -strip all "$file"
              cp "$file" "$cached"
            fi
          }
          export -f process_png

          cat /tmp/pnglist.txt | xargs -0 -P $(nproc) -I {} bash -c 'process_png "$@"' _ {}

          echo "Total PNGs processed: $(wc -l < /tmp/pnglist.txt)"
          echo "Cache entries: $(ls .png-opt-cache | wc -l)"

      - name: Install Haxelib
        run: |
          sudo apt-get install -y libvlc-dev libvlccore-dev --quiet
          haxelib setup ~/haxelib
          haxelib install extension-androidtools > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Install patched hxcpp
        run: |
          curl --silent --output ../hxcpp.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v${{ env.HXCPP_VERSION }}/hxcpp-${{ env.HXCPP_VERSION }}.zip
          haxelib install ../hxcpp.zip --quiet

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Configure Lime Android paths
        run: |
          mkdir -p ~/.lime
          cat > ~/.lime/config.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <section id="defines">
                  <define name="ANDROID_SDK" value="$ANDROID_HOME" />
                  <define name="ANDROID_NDK_ROOT" value="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" />
                  <define name="JAVA_HOME" value="$JAVA_HOME" />
                  <define name="ANDROID_SETUP" value="true" />
              </section>
          </config>
          EOF

      - name: Compile
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ORG_GRADLE_PROJECT_org.gradle.parallel: "true"
          ORG_GRADLE_PROJECT_org.gradle.caching: "true"
        run: |
          FLAGS="-Ddebug"
          if [ "${{ needs.prepare.outputs.demo }}" = "true" ]; then
            FLAGS="$FLAGS -DDEMO"
          fi
          haxelib run lime build android $FLAGS --quiet

      - name: Locate and checksum APK
        id: artifact
        run: |
          APK_DIR="export/debug/android/bin/app/build/outputs/apk/debug"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -iname "*.apk" | head -n1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found under $APK_DIR"
            exit 1
          fi

          NAME="app-${{ needs.prepare.outputs.version }}-debug.apk"
          cp "$APK_PATH" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build summary
        run: |
          {
            echo "### Android Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | ${{ needs.prepare.outputs.version }} |"
            echo "| Demo | ${{ needs.prepare.outputs.demo }} |"
            echo "| APK | ${{ steps.artifact.outputs.apk_name }} |"
            echo "| Size | ${{ steps.artifact.outputs.apk_size }} |"
            echo "| Haxe | ${{ env.HAXE_VERSION }} |"
            echo "| NDK | ${{ env.NDK_VERSION }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: android-debug-${{ needs.prepare.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.apk_name }}
            ${{ steps.artifact.outputs.apk_name }}.sha256
          retention-days: 14
          if-no-files-found: error

  notify:
    name: Notify on failure
    needs: [ prepare, android ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl --silent --fail -H "Content-Type: application/json" -d '{
            "content": "Android build failed on `${{ github.ref_name }}` (${{ github.sha }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
          }' "$DISCORD_WEBHOOK"
