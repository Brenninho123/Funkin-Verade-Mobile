name: Android DEMO Build

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  Android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/Project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache optimized PNGs
        uses: actions/cache@v4
        with:
          path: .png-opt-cache
          key: ${{ runner.os }}-pngopt-${{ hashFiles('assets/**/*.png') }}
          restore-keys: |
            ${{ runner.os }}-pngopt-

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Optimize PNG
        run: |
          sudo apt-get install -y optipng pngquant parallel --quiet
          mkdir -p .png-opt-cache

          find assets -type f -iname "*.png" -print0 > /tmp/pnglist.txt

          process_png() {
            file="$1"
            hash=$(sha1sum "$file" | cut -d' ' -f1)
            cached=".png-opt-cache/$hash.png"

            if [ -f "$cached" ]; then
              cp "$cached" "$file"
            else
              pngquant --force --skip-if-larger --strip --speed 1 --quality=65-90 --output "$file.tmp" "$file" 2>/dev/null && mv "$file.tmp" "$file" || rm -f "$file.tmp"
              optipng -quiet -o4 -strip all "$file"
              cp "$file" "$cached"
            fi
          }
          export -f process_png

          cat /tmp/pnglist.txt | xargs -0 -P $(nproc) -I {} bash -c 'process_png "$@"' _ {}

          echo "Total PNGs processed: $(wc -l < /tmp/pnglist.txt)"
          echo "Cache entries: $(ls .png-opt-cache | wc -l)"

      - name: Install Haxelib
        run: |
          sudo apt-get install -y libvlc-dev libvlccore-dev --quiet
          haxelib setup ~/haxelib
          haxelib install extension-androidtools > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Install patched hxcpp
        run: |
          curl --silent --output ../hxcpp.zip --location https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install ../hxcpp.zip --quiet

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Configure Lime Android paths
        run: |
          mkdir -p ~/.lime
          cat > ~/.lime/config.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <section id="defines">
                  <define name="ANDROID_SDK" value="$ANDROID_HOME" />
                  <define name="ANDROID_NDK_ROOT" value="$ANDROID_HOME/ndk/25.2.9519653" />
                  <define name="JAVA_HOME" value="$JAVA_HOME" />
                  <define name="ANDROID_SETUP" value="true" />
              </section>
          </config>
          EOF

      - name: Compile
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ORG_GRADLE_PROJECT_org.gradle.parallel: "true"
          ORG_GRADLE_PROJECT_org.gradle.caching: "true"
        run: haxelib run lime build android -DDEMO -Ddebug --quiet

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/debug/android/bin/app/build/outputs/apk
